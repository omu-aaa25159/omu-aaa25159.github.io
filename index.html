<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>動く時計</title>
    <script>
        function updateClock() {
            // 現在時刻を取得
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();
            
            // 1桁の場合は0を付ける
            if (hours < 10) hours = '0' + hours;
            if (minutes < 10) minutes = '0' + minutes;
            if (seconds < 10) seconds = '0' + seconds;
            
            // 時刻を表示
            var timeString = hours + ':' + minutes + ':' + seconds;
            document.getElementById('clock').innerHTML = timeString;
        }
        
        // 1秒ごとにupdateClock関数を実行
        setInterval(updateClock, 1000);
        
        // ページ読み込み時に即座に表示
        window.onload = updateClock;
    </script>
    
    <style>
        .clockBody{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .clockContainer{
            width: 300px;
            height: 200px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            border: 3px solid #1c282e;
            border-radius: 10px;
            padding: 20px 0 40px;
            background-color: #dce6f5;
        }
        .clockContainer h1{color:#1c282e;}
    </style>
</head>
    
<body>
    <div clockBody>
        <div class="clockContainer">    
            <h1>現在時刻</h1>
            <div id="clock" style="font-size: 48px; font-weight: bold; color: rgb(56, 139, 203);">
            00:00:00
            </div>
        </div>
    </div>

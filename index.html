        <h2>今川焼</h2>
        <img src="images/imagawayaki.jpg" width="400" height="250" alt="今川焼の写真">
        <p>幅広い年齢層に愛される今川焼<br>
            円盤状のカリッとした生地の中に、もっちりとした生地と餡子やクリームなどが詰まった和菓子<br>
            地域によって呼び名が異なることから、たびたび名称争いが勃発する<br>            
            呼び名は違っても、変わらないおいしさ！
        </p>
        <ul>【コラム】主な名称
            <li>今川焼 / 関東中心に親しまれている</li>
            <li>大判焼き / 東北・東海・四国など</li>
            <li>回転焼き / 関西や九州など</li>
            <li>おやき / 北海道や青森</li>
            <li>そのほか
                <ul>
                    <li>あじもん</li>
                    <li>御座候</li>
                    <li>二重焼き　　など</li>
                </ul>
            </li>
        </ul>
